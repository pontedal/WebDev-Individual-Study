{% extends "base.html" %}
{% block title %}{{ review.title }}{% endblock %}
{% block content %}
<h1>{{ review.title }}</h1>
<p>{{ review.game }} - {{ review.rating }}/10 - {{ review.author }}</p>
<a href="{{ url_for('edit', review_id=review.id) }}">Edit</a>
<form action="{{ url_for('delete_review', review_id=review.id) }}"
      method="POST"
      onsubmit="return confirm('Do you want to delete this review?');">

    <button type="submit">Delete Review</button>

</form>
<a href="{{ url_for('index') }}">Back</a>
{% endblock %}
